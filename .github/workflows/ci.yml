name: CI — verify and publish image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r requirements-dev.txt
      - name: Pylint
        run: python -m pylint app --score=no
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -q
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Normalize image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build --tag "devops-ci-app:${GITHUB_SHA}" .
      - name: Smoke-test container
        run: |
          set -euo pipefail
          cleanup() {
            docker logs smoke || true
            docker rm -f smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name smoke -p 127.0.0.1:5000:5000 "devops-ci-app:${GITHUB_SHA}"
          ready=0
          for attempt in {1..15}; do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:5000/health --output health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::/health did not respond after 15 attempts"
            exit 1
          fi
          python3 -m json.tool health.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("health.json").read_text(encoding="utf-8"))
          assert payload == {"status": "ok"}, f"unexpected /health payload: {payload}"
          PY
          docker exec smoke id
      - name: Tag registry image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "devops-ci-app:${GITHUB_SHA}" "${IMAGE_NAME}:${GITHUB_SHA}"
          docker tag "devops-ci-app:${GITHUB_SHA}" "${IMAGE_NAME}:latest"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, devops-vm]
    permissions:
      contents: read
    concurrency:
      group: deploy-devops-vm
      cancel-in-progress: false
    env:
      VM_HOST: 192.168.56.101
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          CACHE=/root/repo-cache/devops-ci-app
          if [[ ! -d "$CACHE/.git" ]]; then
            mkdir -p /root/repo-cache
            git clone --local /mnt/c/Users/user/Documents/GitHub/devops-ci-app "$CACHE"
            git -C "$CACHE" remote set-url origin "https://github.com/${{ github.repository }}.git"
          fi
          git -C "$CACHE" remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if git -C "$CACHE" fetch --depth 1 origin "${{ github.sha }}" &&                git -C "$CACHE" checkout --force FETCH_HEAD; then
              ok=1
              break
            fi
            echo "fetch attempt ${attempt} failed; retrying"
            sleep $((attempt * 2))
          done
          if [[ "$ok" -ne 1 ]]; then
            # last resort: use whatever SHA is already present locally
            if git -C "$CACHE" cat-file -e "${{ github.sha }}^{commit}"; then
              git -C "$CACHE" checkout --force "${{ github.sha }}"
              ok=1
            fi
          fi
          [[ "$ok" -eq 1 ]]
          git clone --local "$CACHE" .
          git checkout --force "${{ github.sha }}"
      - name: Deploy with Ansible
        working-directory: ansible
        run: |
          set -euo pipefail
          ansible-playbook -i inventory/prod.ini site.yml -e "app_tag=${GITHUB_SHA}"
      - name: Check through Nginx
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            "http://${VM_HOST}/health" --output health.json
          python3 -m json.tool health.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("health.json").read_text(encoding="utf-8"))
          assert payload == {"status": "ok"}, f"unexpected /health payload: {payload}"
          PY

